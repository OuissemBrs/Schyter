[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protoverify"
version = "0.1.0"
description = "A bounded, Scyther-style symbolic security protocol verifier with matplotlib and Manim attack animations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ProtoVerify authors" }]
keywords = ["security", "protocol", "verification", "dolev-yao", "spdl", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.8,<4", "networkx>=3.1,<4", "pillow>=10.1"]
manim = ["manim>=0.18,<0.20", "networkx>=3.1,<4", "pillow>=10.1"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.9",
    "ruff>=0.4",
    "matplotlib>=3.8,<4",
    "networkx>=3.1,<4",
    "pillow>=10.1",
]

[project.scripts]
protoverify = "protoverify.cli:main"

[project.urls]
Homepage = "https://example.invalid/protoverify"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protoverify = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "slow: long-running search or render tests",
    "manim: tests that require the optional manim/ffmpeg stack",
    "viz: tests that require matplotlib",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/protoverify"]
warn_unreachable = true
disallow_any_unimported = false
disallow_subclassing_any = false
[[tool.mypy.overrides]]
module = ["manim.*", "networkx.*", "matplotlib.*", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The Manim scenes subclass ``manim.Scene``, which is untyped at our strictness.
module = ["protoverify.viz.manim_scenes"]
disallow_subclassing_any = false
disable_error_code = ["misc", "union-attr", "attr-defined"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["E501", "SIM108", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "B011"]
"examples/**" = ["ALL"]